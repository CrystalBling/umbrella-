    <script>
      // Intercept and suppress cross-origin / third-party widget errors early
      window.onerror = function(msg, url, line, col, err) {
        if (msg === 'Script error.' || !url || (typeof url === 'string' && !url.includes(window.location.host))) {
          return true; // Suppress third-party cross-origin script error alerts
        }
        return false;
      };
      window.addEventListener('error', function(event) {
        if (event.message === 'Script error.' || !event.filename || (typeof event.filename === 'string' && !event.filename.includes(window.location.host))) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (event.reason.message === 'Script error.' || String(event.reason).includes('Script error'))) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
